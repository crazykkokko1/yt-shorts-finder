name: Auto Knowledge DB Pipeline

on:
  schedule:
    # 매일 새벽 3시 (UTC 기준 18:00)에 자동 실행
    - cron: '0 18 * * *'
  workflow_dispatch: # GitHub 웹에서 수동으로 즉시 실행 버튼을 누를 수도 있습니다.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Auto Pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx scripts/auto-pipeline.ts

      - name: Commit and push updated knowledge DB
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 [Automated] Update knowledge DB and raw reports"
          branch: main